[jupiter.server.http]
    port = 8010  # 该配置无效，使用的是gfast的yaml配置
[jupiter.etcdv3.default]
    endpoints=["127.0.0.1:2379"]
    secure = false
[jupiter.registry.hw]
    configKey="jupiter.etcdv3.default"
    timeout = "1s"
[jupiter.logger.default]
    debug = false  # 是否在命令行输出
    enableConsole = false # 是否按命令行格式输出
    name = "default.json"
    dir = "."